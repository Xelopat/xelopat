    (function () {

        return;
      }
      var st = document.createElement('style');
      st.textContent = 'html,body{margin:0;height:100%;background:#0b0d14;overflow:hidden}' +
        '.kw{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}' +
        'iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;background:#f0f0f0;transform-origin:0 0}' +
        '.rot{position:fixed;left:0;right:0;top:calc(50% + 110px);text-align:center;color:#9496a8;font:13px/1.4 system-ui,sans-serif;padding:0 24px}';
      document.head.appendChild(st);
      document.addEventListener('DOMContentLoaded', function () {
        var box = document.createElement('div'), f = document.createElement('iframe'), hint = document.createElement('div');
        box.className = 'kw';
        f.title = 'Киоск'; f.src = location.pathname + location.search;
        hint.className = 'rot'; hint.textContent = 'Киоск рассчитан на большой горизонтальный экран. Поверните телефон, чтобы он стал крупнее.';
        box.appendChild(f); document.body.appendChild(box); document.body.appendChild(hint);
        function fit() {
          var w = box.clientWidth, h = box.clientHeight, k = Math.min(w / 1920, h / 1080);
          f.style.transform = 'translate(' + (w - 1920 * k) / 2 + 'px,' + (h - 1080 * k) / 2 + 'px) scale(' + k + ')';
          hint.style.display = h > w ? '' : 'none';
        }
        fit(); addEventListener('resize', fit);
      });
    })();
  </script>
