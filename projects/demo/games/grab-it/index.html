<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Grab It!</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b2238; touch-action: none; -webkit-user-select: none; user-select: none; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #1b2238; outline: none; }
      #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-family: Arial, sans-serif; color: #fff; }
      #loader .title { font-size: 42px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 4px 0 #0c1122; }
      #loader .title span { color: #ffd23f; }
      #loader .bar { width: min(60vw, 360px); height: 14px; border-radius: 7px; background: #0c1122; overflow: hidden; }
      #loader .fill { width: 0%; height: 100%; background: linear-gradient(90deg, #2f9bff, #5ef2c8); transition: width .15s; }
    </style>
    <!-- Демо вне платформы: GRABIT_PLATFORM не выставлен, игра берёт локальные заглушки рекламы и сохранений. -->
    <script>window.__DEMO_BAR=window.top!==window?null:{title:"демо Игры",titleHref:"/projects/demo/games/",links:[{label:"Все игры",href:"/projects/demo/games/",current:false},{label:"Все проекты",href:"/projects",current:false}]};</script>
    <script src="./_demo/demo-bar.js" defer></script>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <div class="title">GRAB <span>IT!</span></div>
      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.querySelector('#unity-canvas');
      canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      window.addEventListener('keydown', function (e) {
        // Не даём пробелу и стрелкам скроллить страницу внутри iframe.
        if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) >= 0) e.preventDefault();
      });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data",
        frameworkUrl: "Build/WebGL.framework.js",
        codeUrl: "Build/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Grab It!",
        productVersion: "0.1.0",
        // Холст — в родном разрешении экрана (до 2x): при урезанном DPR на телефоне мылилось всё,
        // включая текст. Цену 3D-сцены держит QualityGuard масштабом рендера URP, интерфейс чёткий.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        // Ошибки SDK Яндекса (404 лидерборда, сеть, реклама) — не повод показывать игроку
        // «An error occurred running the Unity content» и вставать на alert.
        errorHandler: function (message, filename, lineno) {
          var text = String(message || '') + ' ' + String(filename || '');
          if (/yandex|games\.s3|\/sdk\/|sdk\.js/i.test(text)) {
            console.warn('[GrabIt] SDK error ignored:', message);
            return true;
          }
          return false;
        }
      }, function (progress) {
        document.getElementById('fill').style.width = Math.round(progress * 100) + '%';
      }).then(function (unityInstance) {
        window.grabItUnityInstance = unityInstance;
        document.getElementById('loader').style.display = 'none';
      }).catch(function (message) {
        console.error(message);
      });
    </script>
  </body>
</html>
