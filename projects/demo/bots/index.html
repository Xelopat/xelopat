<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram-боты, демо</title>
<style>
  :root{ --bg:#151518; --line:#333340; --text:#efeff1; --muted:#9496a8; --accent:#f9c940; --mono:'Space Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ background:radial-gradient(60% 40% at 25% 0, rgba(249,201,64,.09), transparent 70%), var(--bg); color:var(--text); font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif; padding:34px 18px 100px; }
  .wrap{ max-width:1100px; margin:0 auto; }
  .label{ font-family:var(--mono); font-size:12px; color:var(--accent); margin-bottom:10px; }
  h1{ margin:0 0 12px; font-size:clamp(30px,4.6vw,52px); line-height:1.05; letter-spacing:-.03em; }
  .lead{ max-width:700px; margin:0 0 30px; color:var(--muted); font-size:clamp(15px,1.5vw,18px); }
  .grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px; }
  .g{ display:flex; flex-direction:column; border:1px solid #2c2c38; border-radius:18px; overflow:hidden; background:linear-gradient(180deg,#20202a,#17171d); box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 24px 48px -28px rgba(0,0,0,.8); transition:.22s; }
  .g:hover{ border-color:rgba(249,201,64,.55); transform:translateY(-4px); box-shadow:0 30px 60px -28px rgba(0,0,0,.9), 0 18px 50px -24px rgba(249,201,64,.35); }
  .shot{ position:relative; display:block; aspect-ratio:16/9; border:0; padding:0; width:100%; cursor:pointer; background:#101014; overflow:hidden; }
  .shot img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s; }
  .g:hover .shot img{ transform:scale(1.03); }
  .shot::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 50%,rgba(10,10,14,.55)); }
  .play{ position:absolute; z-index:2; right:14px; bottom:14px; display:flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px; background:var(--accent); color:#1b1606; font:700 13px Inter,sans-serif; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .body{ padding:18px 20px 20px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .body h2{ margin:0; font-size:22px; letter-spacing:-.015em; }
  .body p{ margin:0; color:var(--muted); font-size:14.5px; line-height:1.6; }
  .tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; padding-top:4px; }
  .tags span{ padding:4px 11px; border:1px solid #33333f; border-radius:999px; background:rgba(255,255,255,.04); font-family:var(--mono); font-size:11px; color:#c5c8d6; }
  .foot{ margin-top:26px; color:var(--muted); font-size:13px; }

  .ov{ position:fixed; inset:0; z-index:100; display:none; flex-direction:column; background:#0b0b0e; }
  .ov.on{ display:flex; }
  .ovbar{ flex:none; display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line); background:#151518; }
  .ovtabs{ flex:1; min-width:0; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
  .ovtabs::-webkit-scrollbar{ display:none; }
  .ovtabs button{ flex:none; padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:transparent; color:var(--muted); font:600 13px Inter,sans-serif; cursor:pointer; white-space:nowrap; }
  .ovtabs button:hover{ color:var(--text); }
  .ovtabs button.on{ background:var(--accent); border-color:var(--accent); color:#1b1606; }
  .ovbar button{ padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.05); color:var(--text); font:600 13px Inter,sans-serif; cursor:pointer; }
  .ovbar button:hover{ border-color:var(--accent); color:var(--accent); }
  .ov iframe{ flex:1; width:100%; border:0; background:#000; }

  @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="label">// telegram bots</div>
  <h1>Telegram-боты</h1>
  <p class="lead">Четыре бота для разных задач: платная подписка, расчёт натальной карты, поиск заказов и запись клиентов. Нажмите на обложку и пройдите путь пользователя в окне Telegram. Данные в демо тестовые.</p>
  <div class="grid" id="grid"></div>
</div>

<div class="ov" id="ov" aria-hidden="true">
  <div class="ovbar"><div class="ovtabs" id="ovTabs"></div><button id="ovR" type="button">Обновить</button><button id="ovX" type="button">Закрыть</button></div>
  <iframe id="fr" title="Бот" allow="fullscreen; autoplay" allowfullscreen></iframe>
</div>

<script>window.__DEMO_BAR=/[?&]shot/.test(location.search)?null:{title:"демо Боты",links:[{label:"Все проекты",href:"/projects",current:false}]};</script>
<script src="./_demo/demo-bar.js" defer></script>
<script>
(function(){
  'use strict';
  var GAMES = [
    {id:'pay-bot', t:'Бот с платной подпиской', d:'Принимает оплату, открывает доступ в закрытый канал, напоминает о продлении и убирает из канала тех, кто не продлил.', tags:['Python','ЮKassa','PostgreSQL']},
    {id:'natal-bot', t:'Бот натальной карты', d:'Спрашивает данные о рождении, строит карту по астрономическим расчётам и присылает картинку с разбором. Полный разбор платный.', tags:['Python','aiogram','Swiss Ephemeris']},
    {id:'radar-bot', t:'Радар фриланс-заказов', d:'Следит за лентами заказов и присылает только подходящие под ваши темы, бюджет и стек. Фильтры настраиваются.', tags:['Python','aiogram','RSS']},
    {id:'booking-bot', t:'Конструктор бота для записи', d:'Администратор создаёт записи в чате, клиенты записываются, платят и получают ссылку с деталями.', tags:['Python','aiogram','Docker']}
  ];
  var $ = function(id){ return document.getElementById(id); };
  var cur = null;
  $('grid').innerHTML = GAMES.map(function(g){
    return '<article class="g"><button class="shot" type="button" data-id="' + g.id + '" aria-label="Открыть: ' + g.t + '"><img src="./covers/' + g.id + '.webp" alt="" loading="lazy"><span class="play">&#9654; Открыть</span></button>' +
      '<div class="body"><h2>' + g.t + '</h2><p>' + g.d + '</p><div class="tags">' + g.tags.map(function(x){ return '<span>' + x + '</span>'; }).join('') + '</div></div></article>';
  }).join('');
  function open(id){
    cur = GAMES.filter(function(g){ return g.id === id; })[0];
    tabs(); $('fr').src = '../' + id + '/index.html';
    $('ov').classList.add('on'); $('ov').setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden';
  }
  function tabs(){
    $('ovTabs').innerHTML = '';
    GAMES.forEach(function(g){ var b = document.createElement('button'); b.type = 'button'; b.textContent = g.t; b.className = g.id === cur.id ? 'on' : ''; b.onclick = function(){ open(g.id); }; $('ovTabs').appendChild(b); });
    var on = $('ovTabs').querySelector('.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  }
  function close(){ $('ov').classList.remove('on'); $('ov').setAttribute('aria-hidden', 'true'); $('fr').src = 'about:blank'; document.body.style.overflow = ''; }
  $('grid').addEventListener('click', function(e){ var b = e.target.closest('.shot'); if (b) open(b.dataset.id); });
  $('ovX').onclick = close;
  $('ovR').onclick = function(){ if (cur) $('fr').src = '../' + cur.id + '/index.html'; };
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && $('ov').classList.contains('on')) close(); });
})();
</script>
</body>
</html>
